# Databricks App: Streamlit chat UI for the data dictionary.
command: ["streamlit", "run", "app.py"]
env:
  - name: MCP_SERVER_URL
    value: "https://<your-mcp-hc-dictionary-app-url>/mcp"   # copy from the MCP app's Overview page + /mcp
  - name: LLM_ENDPOINT
    valueFrom: serving-endpoint     # App resource: Serving endpoint (CAN QUERY) -> your chat model
  - name: USE_OBO
    value: "false"                  # "true" = run tools as the signed-in user (needs user authorization scopes on the app)
